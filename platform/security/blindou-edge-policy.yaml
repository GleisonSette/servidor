apiVersion: security.servidor.local/v1alpha1
kind: NetworkContainmentPolicy
metadata:
  name: blindou-temporary-host-edge
  annotations:
    security.servidor.local/status: prepared-not-enforced
    security.servidor.local/owner: platform
    security.servidor.local/expires-on: vultr-cutover
spec:
  threatModel:
    containApplicationOrContainerCompromise: true
    containPhysicalHostRootCompromise: false
    protectHomeAndAdministrativeNetworksBestEffort: true
    preventAllDataExfiltration: false
    rationale: >-
      UFW, sysctl, Pod Security e NetworkPolicy reduzem movimento lateral, mas
      um invasor com root no host pode removê-los. A decisão temporária termina
      quando o Blindou migrar para a Vultr.
  observedTopology:
    ont:
      manufacturer: Huawei
      model: HG8145V5
      configurationProfile: OI2
      managementAddress: 192.168.100.1
    physicalServer:
      hostname: apiwpp
      currentAddress: 192.168.100.59
      currentInterface: enp2s0
      spareInterface: eno1
      observedIpv6PrefixLength: 64
    administrativeWorkstation:
      address: 192.168.100.57
    unmanagedSwitch:
      manufacturer: Knup
      model: KP-SW105
      securityBoundary: false
    currentIsolation: absent
  temporaryTopology:
    internetEdge: huawei-ont-no-port-forward
    enforcementPoint: ufw-and-kubernetes-on-physical-host
    cloudflareConnectorPlacement: blindou-edge-namespace
    applicationNamespace: blindou-production
    localProjectsAllowed: [apiwpp, blindou]
    definitiveDestination: vultr
  invariants:
    wanIngressToServer: deny
    lanPrivateDestinationsFromPhysicalInterface: deny-and-log
    forwardedPrivateDestinationsFromWorkloads: deny-and-log
    lanIngressExceptAdministrativeWorkstation: deny
    physicalInterfaceIpv6: disabled
    directPublicEgress: temporarily-allowed
    internetToApplication: cloudflare-tunnel-only
    cloudflareConnectorOutsideEdgeNamespace: forbidden
    tunnelTokenOutsideEdgeSecret: forbidden
    universalPlugAndPlay: disabled
    ontDmzHostFeature: disabled
    portForwardingToServer: forbidden
    publicKubernetesService: forbidden
    apiwppService: preserve
    blindouApiwppProvider: disabled
  permittedFlows:
    - id: administration-ssh
      source: 192.168.100.57
      destination: 192.168.100.59
      protocol: tcp
      ports: [22]
      conditions: [key-authentication, ufw-rate-limited]
    - id: administration-kubernetes
      source: 192.168.100.57
      destination: 192.168.100.59
      protocol: tcp
      ports: [6443]
      conditions: [existing-mutual-authentication]
    - id: server-dhcp
      source: 192.168.100.59
      destination: 192.168.100.1
      protocol: udp
      ports: [67, 68]
    - id: server-dns
      source: 192.168.100.59
      destination: 192.168.100.1
      protocol: [udp, tcp]
      ports: [53]
    - id: cloudflare-edge
      source: blindou-edge
      destination: cloudflare-public-edge
      protocol: tcp
      ports: [7844]
      conditions: [http2, tunnel-token-file, no-auto-update]
    - id: edge-to-origin
      source: blindou-edge
      destination: [blindou-backend, blindou-redirector]
      protocol: tcp
      ports: [8080, 8090]
      conditions: [clusterip-only, network-policy]
    - id: blindou-provider-egress
      source: blindou-production
      destination: public-internet-excluding-reserved-cidrs
      protocol: tcp
      ports: [443]
      conditions: [network-policy, application-ssrf-validation, logged]
  activationGates:
    - blindou-hostctl-installed-root-owned
    - ufw-temporary-rules-verified
    - physical-interface-ipv6-disabled
    - ont-management-negative-test
    - apiwpp-remains-healthy
    - blindou-production-and-edge-gates-passed
    - cloudflare-routes-waf-and-access-verified
    - no-wan-port-forward-upnp-or-dmz-host
    - rollback-tested-or-console-confirmed
  expirationGates:
    - vultr-platform-ready
    - authority-cutover-complete
    - physical-cloudflared-scaled-to-zero
    - temporary-ufw-rules-reviewed-for-removal
