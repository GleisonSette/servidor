apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: blindou-edge
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: edge-budget
  namespace: blindou-edge
spec:
  hard:
    requests.cpu: 100m
    requests.memory: 128Mi
    limits.cpu: 500m
    limits.memory: 512Mi
    pods: "2"
    services: "1"
    secrets: "4"
    configmaps: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: edge-defaults
  namespace: blindou-edge
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      default:
        cpu: 250m
        memory: 256Mi
      max:
        cpu: 500m
        memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: blindou-edge
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-dns
  namespace: blindou-edge
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
