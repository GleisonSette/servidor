apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: shared-lab-private-services
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - services
        scope: Namespaced
  validations:
    - expression: "!has(object.spec.type) || object.spec.type == 'ClusterIP'"
      message: "Espaços do laboratório aceitam somente Service ClusterIP."
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: "externalIPs não é permitido nos espaços do laboratório."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: shared-lab-private-services
spec:
  policyName: shared-lab-private-services
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        platform.servidor.local/managed: "true"
