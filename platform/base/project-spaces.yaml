apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: cia-pixel-lab
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: project-budget
  namespace: cia-pixel-lab
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 768Mi
    limits.cpu: "1500m"
    limits.memory: 2Gi
    requests.storage: 30Gi
    persistentvolumeclaims: "4"
    pods: "12"
    services: "8"
    secrets: "24"
    configmaps: "24"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: cia-pixel-lab
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 256Mi
      max:
        cpu: "1"
        memory: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cia-pixel-lab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-dns
  namespace: cia-pixel-lab
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
