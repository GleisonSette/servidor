apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dre-controller-only
  labels:
    app.kubernetes.io/part-of: dre-familiar
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - configmaps
          - limitranges
          - namespaces
          - persistentvolumeclaims
          - pods
          - resourcequotas
          - secrets
          - serviceaccounts
          - services
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - deployments
          - statefulsets
      - apiGroups:
          - batch
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - jobs
      - apiGroups:
          - networking.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - networkpolicies
      - apiGroups:
          - policy
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - poddisruptionbudgets
      - apiGroups:
          - storage.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - storageclasses
  matchConditions:
    - name: dre-scope-only
      expression: >-
        request.namespace in ['dre-production', 'dre-edge', 'dre-restore-drill', 'dre-validation'] ||
        (request.resource.resource == 'namespaces' &&
          request.name in ['dre-production', 'dre-edge', 'dre-restore-drill', 'dre-validation']) ||
        (request.resource.resource == 'storageclasses' &&
          request.name in ['dre-local-retain', 'dre-local-delete-drill'])
  validations:
    - expression: >-
        request.userInfo.username == 'dre-deployctl' ||
        request.userInfo.username == 'system:kube-controller-manager' ||
        (request.userInfo.username == 'system:kube-scheduler' &&
          request.operation == 'UPDATE' &&
          request.resource.resource == 'persistentvolumeclaims') ||
        request.userInfo.username.startsWith('system:node:') ||
        request.userInfo.username.startsWith('system:serviceaccount:kube-system:') ||
        (request.userInfo.username == 'system:admin' &&
          request.resource.resource in ['namespaces', 'storageclasses'])
      message: recursos DRE só podem ser alterados pelo controlador fechado
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dre-controller-only
  labels:
    app.kubernetes.io/part-of: dre-familiar
spec:
  policyName: dre-controller-only
  validationActions:
    - Deny
