apiVersion: apps/v1
kind: Deployment
metadata:
  name: dre-cloudflared
  namespace: dre-edge
  labels:
    app.kubernetes.io/name: dre-cloudflared
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: dre-familiar
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dre-cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dre-cloudflared
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: dre-familiar
    spec:
      serviceAccountName: dre-cloudflared
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        appArmorProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared@sha256:18626b1baac4450214535cd5bc40ef44c0635244d585ebf707749c22b6f3408f
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --protocol
            - http2
            - --metrics
            - 0.0.0.0:20241
            - run
            - --token-file
            - /etc/cloudflared/token
          ports:
            - name: metrics
              containerPort: 20241
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tunnel-token
              mountPath: /etc/cloudflared
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: tunnel-token
          secret:
            secretName: dre-cloudflare-tunnel
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
