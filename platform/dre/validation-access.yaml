apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dre-deployctl
  namespace: dre-validation
  labels:
    app.kubernetes.io/part-of: dre-familiar
    app.kubernetes.io/managed-by: dre-controller-bootstrap
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - limitranges
      - persistentvolumeclaims
      - pods
      - resourcequotas
      - secrets
      - serviceaccounts
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/exec
      - services/proxy
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dre-deployctl
  namespace: dre-validation
  labels:
    app.kubernetes.io/part-of: dre-familiar
    app.kubernetes.io/managed-by: dre-controller-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dre-deployctl
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: dre-deployctl
