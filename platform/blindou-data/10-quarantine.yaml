apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: blindou-data
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-quarantine
  namespace: blindou-data
spec:
  hard:
    pods: "0"
    services: "0"
    secrets: "0"
    persistentvolumeclaims: "0"
    configmaps: "1"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: platform-quarantine-defaults
  namespace: blindou-data
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "2"
        memory: 3Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-default-deny
  namespace: blindou-data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
