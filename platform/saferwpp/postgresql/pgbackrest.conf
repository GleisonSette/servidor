[global]
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest/saferwpp-lab
spool-path=/var/spool/pgbackrest/saferwpp-lab
process-max=2
start-fast=y

repo1-type=posix
repo1-path=/var/lib/pgbackrest/saferwpp-lab
repo1-bundle=y
repo1-block=y
repo1-cipher-type=aes-256-cbc
repo1-retention-full=4
repo1-retention-diff=7

repo2-type=s3
repo2-path=/saferwpp-lab
repo2-s3-bucket=saferwpp-postgres-backup-lab
repo2-s3-region=auto
repo2-s3-uri-style=path
repo2-storage-verify-tls=y
repo2-bundle=y
repo2-block=y
repo2-cipher-type=aes-256-cbc
repo2-retention-full=8
repo2-retention-diff=14

[saferwpp-lab]
pg1-path=/var/lib/postgresql/18/saferwpp_lab
pg1-port=55432
pg1-socket-path=/var/run/postgresql
