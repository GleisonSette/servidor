# Configuração exclusiva do cluster PostgreSQL 18 saferwpp_lab.
cluster_name = 'saferwpp-lab'
listen_addresses = '127.0.0.1,192.168.100.59'
port = 55432
max_connections = 24
superuser_reserved_connections = 3
reserved_connections = 2

shared_buffers = '512MB'
work_mem = '4MB'
maintenance_work_mem = '128MB'
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = on
pg_stat_statements.track = 'top'
pg_stat_statements.max = 5000
pg_stat_statements.save = on
track_io_timing = on

password_encryption = 'scram-sha-256'
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
ssl_cert_file = '/etc/saferwpp/postgres/tls/server-cert.pem'
ssl_key_file = '/etc/saferwpp/postgres/tls/server-key.pem'
ssl_ca_file = '/etc/saferwpp/postgres/tls/client-ca.pem'
hba_file = '/etc/postgresql/18/saferwpp_lab/pg_hba.conf'

archive_mode = on
archive_timeout = '900s'
archive_command = '/usr/bin/pgbackrest --config=/etc/pgbackrest/saferwpp-lab.conf --stanza=saferwpp-lab archive-push %p'

timezone = 'UTC'
log_timezone = 'UTC'
log_connections = off
log_disconnections = off
log_statement = 'none'
log_min_duration_statement = -1
log_lock_waits = on
idle_in_transaction_session_timeout = '15s'
lock_timeout = '5s'
