apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: saferdock-identity
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: keycloak-exclusive-budget
  namespace: saferdock-identity
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 1Gi
    limits.cpu: 1500m
    limits.memory: 2Gi
    persistentvolumeclaims: "0"
    pods: "2"
    services: "2"
    secrets: "16"
    configmaps: "16"
    count/jobs.batch: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: keycloak-container-limits
  namespace: saferdock-identity
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      default:
        cpu: "1"
        memory: 1Gi
      max:
        cpu: "1"
        memory: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: saferdock-identity
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-dns
  namespace: saferdock-identity
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: saferdock-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: control-plane-exclusive-budget
  namespace: saferdock-platform
spec:
  hard:
    requests.cpu: 250m
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    persistentvolumeclaims: "0"
    pods: "2"
    services: "2"
    secrets: "16"
    configmaps: "16"
    count/jobs.batch: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: control-plane-container-limits
  namespace: saferdock-platform
spec:
  limits:
    - type: Container
      defaultRequest:
