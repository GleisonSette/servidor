apiVersion: v1
kind: Namespace
metadata:
  name: blindou-edge
  labels:
    platform.servidor.local/managed: "true"
    platform.servidor.local/project: blindou
    platform.servidor.local/environment: production
    platform.servidor.local/role: edge
    platform.servidor.local/deployment-gate: connector-only
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
  annotations:
    platform.servidor.local/gate-reason: cloudflare-connector-only
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-quarantine
  namespace: blindou-edge
spec:
  hard:
    pods: "1"
    services: "0"
    secrets: "1"
    persistentvolumeclaims: "0"
    configmaps: "1"
